[supervisord]
nodaemon=true
loglevel=warn

[program:sshd]
command=/usr/sbin/sshd -D -e
priority=10
redirect_stderr=true
stdout_logfile=/var/log/ssh.log
stdout_logfile_maxbytes=0
autorestart=true

[program:php-fpm]
# command=/usr/sbin/php-fpm8.x
# ln -sf /usr/sbin/php-fpm8.x /usr/sbin/php-fpm
command=/usr/sbin/php-fpm
autorestart=true

[program:cron]
command=cron -f
